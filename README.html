<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header{
            background: #222;
            color: white;
            padding: 30px;
        }

        main{
            padding: 40px;
        }

        .card{
            background: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }

        button{
            background: #0077ff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover{
            background: #0055cc;
        }

        footer{
            margin-top: 40px;
            background: #222;
            color: white;
            padding: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenido a Mi Página</h1>
        <p>Hecha con HTML y CSS</p>
    </header>

    <main>
        <div class="card">
            <h2>Hola, Esta es la quinta pagina que subo, pero ahora en lenguaje HTML</h2>
            <p>Esta es una página sencilla para subir a GitHub Pages.</p>

            <button onclick="mensaje()">
                Haz clic
            </button>
        </div>
    </main>

    <footer>
        <p>© 2026 Mi Página Web</p>
    </footer>

    <script>
        function mensaje(){
            alert("¡Hola desde JavaScript!");
        }
    </script>

</body>
</html>
